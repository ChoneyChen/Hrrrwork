name: Release desktop apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: package:mac
          - os: ubuntu-24.04
            command: package:linux
          - os: windows-2022
            command: package:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify update selection, downloads and integrity on this platform
        run: npx vitest run src/main/updates src/shared/wakeSchedule.test.ts src/renderer/src/QuotaCard.test.tsx
      - run: npm run ${{ matrix.command }}
      - name: Check lean application payload
        run: node scripts/check-package.mjs
      - name: Verify Windows install and restart handoff
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-install.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Hrrrwork-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
